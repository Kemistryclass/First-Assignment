<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <header>

        <div class="store_ban">
            <img src="360_F_601373620_MmbhfIt2UJN50Id30ZNFhqfoMWUysHnx.jpg" alt="banner">
            <h1 style="font-size:50px;text-transform: uppercase;">
            Laptop Galore!
                </h1>
            </div>
        </header>
         <nav>
            <a href="home.html">Home</a>
            <a href="2">About us</a>
            <a href="3">Shopping Cart</a>
            <a href="4">Product</a>
            <a href="signup.html">Login</a>
            <a href="6">Contact Us</a>
        </nav>
        <main>
    <form onsubmit="return validateForm()" novalidate>
  <div class="mb-3">
    <label for="username" class="form-label">Username:</label>
    <input type="text" class="form-control" id="username" aria-describedby="username" onfocusout="validate(this)">
    
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" class="form-control" id="email" onfocusout="validate(this)">
    </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password:</label>
    <input type="password" class="form-control" id="password" onfocusout="validate(this)">
    </div>

  <div class="mb-3">
  <label for="confirmpassword" class="form-label">Confirm Password</label>
    <input type="password" class="form-control" id="confirmpassword" onfocusout="validate(this)" >
  </div>
  <button type="submit" class="btn btn-primary">SignUp</button>
</form>
</main>
  <footer>
            <a href="#">Terms Of Use</a>
            <a href="#">Cookies and Privacy Policy</a>
            <p>Copyright 2026. LaptopGalore</p>
        </footer>
        <script>
          function validate(obj){
            if(obj.value.trim() === ""){
              obj.style.color ="red";
              obj.style.borderColor ="red";
              alert("Requires input")
              return false;
            }
            if (obj.id === "email" && !obj.checkValidity()){
              obj.style.color = "red";
              obj.style.borderColor ="red";
              alert("Entered wrong email");
              return false
            }
            if(obj.id === "confirmpassword"){
              if(obj.value !== document.getElementById("password").value){
                obj.style.color="red";
                obj.style.borderColor="red";
                alert("Password is wrong fool")
                return false;
              }
            }
            obj.style.color ="";
            obj.style.borderColor ="";
            return true
          }
          function validateForm(){
            let fields =["username","email","password","confirmpassword"];
            let valid = true;

            for(let id of fields){
              if(!validate(document.getElementById(id)))
              {valid=false;

              }
            }
            if(valid){
              alert("All fields are good");
            }
            return false;
          }
        </script>
</body>
</html>
